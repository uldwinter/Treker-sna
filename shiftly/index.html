<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090e"><meta name="apple-mobile-web-app-capable" content="yes"><title>Shiftly — работа, смены и выплаты</title><style>html,body{margin:0;background:#07090e;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#boot{padding:32px} </style></head><body><div id="boot">Shiftly загружается…</div><script>(async()=>{try{const ps=await Promise.all(Array.from({length:8},(_,i)=>fetch('/p/'+i+'.txt?3').then(r=>r.text())));const b=Uint8Array.from(atob(ps.join('')),c=>c.charCodeAt(0));const s=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));const x=await new Response(s).text(),k=x.indexOf('\n/*__SHIFTLY_JS__*/\n');const st=document.createElement('style');st.textContent=x.slice(0,k);document.head.appendChild(st);document.body.innerHTML='<div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><div class="app-shell"><header class="topbar"><button class="brand" id="brandBtn"><span class="brand-mark">S</span><span>Shiftly</span><b>3</b></button><div class="top-actions"><span id="syncBadge" class="sync-badge"><i></i><span>локально</span></span><button id="accountBtn" class="avatar-btn"><span>◉</span></button></div></header><main id="app"></main><nav class="bottom-nav"><button data-tab="home" class="active"><span>⌂</span><small>Главная</small></button><button data-tab="calendar"><span>▦</span><small>Календарь</small></button><button id="quickAdd" class="quick-add">＋</button><button data-tab="payments"><span>₽</span><small>Выплаты</small></button><button data-tab="works"><span>◫</span><small>Работы</small></button></nav></div><div id="modal" class="modal hidden"><div id="sheet" class="sheet"></div></div><div id="toast" class="toast"></div>';(0,eval)(x.slice(k+20));}catch(e){document.getElementById('boot').textContent='Ошибка загрузки Shiftly: '+e.message}})()</script></body></html>
